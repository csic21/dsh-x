name: Deploy docs and plugin market

# The Pages artifact is the documentation site plus the generated plugin market
# index. Deployment needs Pages enabled once in repository settings with
# "GitHub Actions" as the source. A plugins-v* tag rebuilds it so Discover sees
# the new commit-pinned version without a separate release asset.
on:
  push:
    branches: [main]
    tags: ['plugins-v*']
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/generate-market-index.mjs'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build the site and market index
        working-directory: docs
        run: npm run build
      - name: Verify the market index shipped
        run: test -s docs/.vitepress/dist/market-index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
