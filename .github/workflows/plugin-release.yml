name: Verify plugin tag

# Tags are the release source: the Pages workflow turns each plugins-v* tag into
# a commit-pinned market index entry. This job only proves the tagged tree still
# builds, typechecks and passes its tests before the index is published.
on:
  push:
    tags: ['plugins-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the qualified pnpm version
        id: policy
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("compatibility/policy.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `pnpm=${p.packageManager.version}\n`);
          '
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.policy.outputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check each plugin version against its last release
        run: node scripts/check-plugin-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Test the tagged tree
        timeout-minutes: 15
        run: node --test --test-timeout=600000 packages/*/test/*.test.ts test/*.test.js
      - name: Generate the market index snapshot
        run: node scripts/generate-market-index.mjs --output "$RUNNER_TEMP/market-index.json"
      - uses: actions/upload-artifact@v4
        with:
          name: market-index
          path: ${{ runner.temp }}/market-index.json
          if-no-files-found: error
          retention-days: 14
