name: Package desktop

on:
  push:
    branches: [work/stock-chat-plugins]
    paths:
      - packages/dsh-x-browser/**
      - scripts/desktop-browser-smoke.mjs
      - scripts/desktop-opencode-proof.mjs
      - scripts/desktop-build-cache.mjs
      - test/desktop-build-cache.test.js
      - scripts/fixtures/desktop-opencode-driver/**
      - scripts/fixtures/desktop-browser-smoke/**
      - .github/workflows/desktop-package.yml
  workflow_dispatch:
    inputs:
      kernel_repository:
        description: 官方内核仓库
        required: true
        default: deepseek-ai/deepseek-harness
        type: string
      kernel_ref:
        description: 内核的分支、tag 或提交
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('desktop-proof-{0}', github.ref) || format('desktop-package-manual-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/work/stock-chat-plugins' && contains(github.event.head_commit.message, '[replace-failed-proof]') }}

jobs:
  package:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            package_script: package:desktop:mac:arm64:unsigned
            artifact_glob: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/**
          - name: windows-x64
            os: windows-2022
            package_script: package:desktop:win:x64:unsigned
            artifact_glob: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**

    steps:
      - name: Checkout dsh-x
        uses: actions/checkout@v4
        with:
          path: dsh-x

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repository }}
          ref: ${{ inputs.kernel_ref }}
          path: deepseek-harness
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: deepseek-harness/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install kernel dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Write Windows packaging env
        if: matrix.name == 'windows-x64'
        working-directory: deepseek-harness
        shell: pwsh
        env:
          APP_ID: ${{ vars.DSH_DESKTOP_APP_ID }}
          UPDATE_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_ID)) {
            throw '仓库变量 DSH_DESKTOP_APP_ID 未设置'
          }
          if ($env:UPDATE_ORIGIN -notmatch '^https://') {
            throw '仓库变量 DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN 必须是 https:// 开头'
          }
          $config = @{ allowedAuthOrigins = @($env:UPDATE_ORIGIN) } | ConvertTo-Json -Compress
          @(
            "DSH_DESKTOP_APP_ID=$($env:APP_ID)"
            "DSH_DESKTOP_AUTO_UPDATE_ENV=test"
            "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=$($env:UPDATE_ORIGIN)"
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG=$config"
          ) | Set-Content -Encoding utf8 apps/desktop/.env.windows

      - name: Package unsigned desktop
        working-directory: deepseek-harness
        run: pnpm run ${{ matrix.package_script }}

      - name: Write build manifest
        working-directory: deepseek-harness
        shell: bash
        run: |
          mkdir -p apps/desktop/.desktop-build/manifest
          cat > apps/desktop/.desktop-build/manifest/build-manifest.json <<EOF
          {
            "kernelRepository": "${{ inputs.kernel_repository }}",
            "kernelRef": "${{ inputs.kernel_ref }}",
            "kernelSha": "$(git rev-parse HEAD)",
            "dshXSha": "$(git -C "$GITHUB_WORKSPACE/dsh-x" rev-parse HEAD)",
            "target": "${{ matrix.name }}",
            "packageScript": "${{ matrix.package_script }}"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            deepseek-harness/apps/desktop/.desktop-build/manifest/build-manifest.json
            deepseek-harness/${{ matrix.artifact_glob }}

  browser-smoke:
    name: Actual Windows Desktop browser smoke
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
      # Exact upstream source reviewed for the plugin guest-lease contract.
      DSH_SMOKE_KERNEL_SHA: 1517a4dbca0a2789ff1d41ba439600f8547d23fa
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-x
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 1517a4dbca0a2789ff1d41ba439600f8547d23fa
          path: deepseek-harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: deepseek-harness/package.json
      - name: Build plugin clients
        working-directory: dsh-x
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix packages/dsh-x-browser run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure isolated unsigned smoke package
        working-directory: deepseek-harness
        run: |
          # Reserved .invalid endpoint: no SSO, real update service, or credentials.
          # "production" selects anonymous policy semantics, NOT publication.
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness.smoke'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://dsh-smoke.invalid'
          ) | Set-Content -Encoding utf8 apps/desktop/.env.windows
      # Cache only the pristine official package, before any profile/plugin launch.
      # Exact keys and hashes detect input drift/corruption; producer workflow trust
      # is still required. Never cache user data, profiles, or provider state.
      - name: Fingerprint official package inputs
        id: desktop-inputs
        run: |
          $pnpmVersion = (pnpm --version).Trim()
          $json = node dsh-x/scripts/desktop-build-cache.mjs fingerprint --kernel deepseek-harness --pnpm-version $pnpmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs = $json | ConvertFrom-Json
          "key=$($inputs.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "DSH_BUILD_PNPM_VERSION=$pnpmVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore exact trusted official package cache
        id: desktop-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.desktop-inputs.outputs.key }}
          path: |
            deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked
            deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/dsh-build-cache-manifest.json
      - name: Reject nonexact cache restoration
        if: (steps.desktop-cache.outputs.cache-hit == 'true' || steps.desktop-cache.outputs.cache-matched-key != '') && (steps.desktop-cache.outputs.cache-hit != 'true' || steps.desktop-cache.outputs.cache-matched-key != steps.desktop-inputs.outputs.key)
        run: throw 'Nonexact official package cache restore refused; no cached executable was launched'
      - name: Verify every restored official package file
        if: steps.desktop-cache.outputs.cache-hit == 'true' && steps.desktop-cache.outputs.cache-matched-key == steps.desktop-inputs.outputs.key
        run: node dsh-x/scripts/desktop-build-cache.mjs verify --kernel deepseek-harness --pnpm-version "$env:DSH_BUILD_PNPM_VERSION"
      - name: Install official kernel dependencies
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build official unsigned unpacked Windows application
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        working-directory: deepseek-harness
        run: pnpm --filter @deepseek-ai/dsh-desktop run package win-x64 --unsigned --dir
      - name: Hash pristine official package before any execution
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        run: node dsh-x/scripts/desktop-build-cache.mjs write --kernel deepseek-harness --pnpm-version "$env:DSH_BUILD_PNPM_VERSION"
      - name: Save pristine package for exact-input proof iterations
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.desktop-inputs.outputs.key }}
          path: |
            deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked
            deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/dsh-build-cache-manifest.json
      - name: Record verified package cache provenance
        env:
          EXPECTED_CACHE_KEY: ${{ steps.desktop-inputs.outputs.key }}
          EXACT_CACHE_HIT: ${{ steps.desktop-cache.outputs.cache-hit }}
        run: |
          $manifestPath = 'deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/dsh-build-cache-manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force desktop-smoke-evidence | Out-Null
          @{
            key = $env:EXPECTED_CACHE_KEY
            exactHit = ($env:EXACT_CACHE_HIT -eq 'true')
            manifestSha256 = (Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            producer = $manifest.producer
            inputs = $manifest.inputs
            fileCount = $manifest.files.Count
            trust = 'Reviewed producer workflow; manifest verifies integrity, not independent authenticity'
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 desktop-smoke-evidence/cache-provenance.json
          "Official package cache exact hit: $($env:EXACT_CACHE_HIT -eq 'true'); verified files: $($manifest.files.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Install pinned official Electron test driver
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/desktop-driver" | Out-Null
          npm install --prefix "$env:RUNNER_TEMP/desktop-driver" --no-audit --no-fund playwright@1.61.1
      - name: Exercise actual visible native guest
        working-directory: dsh-x
        env:
          DSH_SMOKE_KERNEL: ${{ github.workspace }}/deepseek-harness
          DSH_SMOKE_HOME: ${{ runner.temp }}/dsh-browser-smoke-home
          DSH_SMOKE_OUTPUT: ${{ github.workspace }}/desktop-smoke-evidence
          DSH_SMOKE_DRIVER: ${{ runner.temp }}/desktop-driver
        run: node scripts/desktop-browser-smoke.mjs
      - name: Retain proof or failure evidence (never a distributable installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: desktop-smoke-evidence/**

      - name: Download and verify official OpenCode for requested public proof
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[opencode-public-proof]')
        run: |
          $archive = "$env:RUNNER_TEMP/opencode-windows-x64.zip"
          Invoke-WebRequest 'https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-windows-x64.zip' -OutFile $archive
          $expected = 'e4ce9117f55fc068414513789f8c7d1049f855d7518bb4e350b9170a3a20d8c3'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Official OpenCode archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/opencode-public-proof"
          $exe = @(Get-ChildItem "$env:RUNNER_TEMP/opencode-public-proof" -Filter opencode.exe -Recurse)
          if ($exe.Count -ne 1) { throw 'Expected exactly one official OpenCode executable' }
          "DSH_OPENCODE_EXE=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Requested real OpenCode free hello and visible Google proof
        timeout-minutes: 20
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[opencode-public-proof]')
        working-directory: dsh-x
        env:
          DSH_SMOKE_KERNEL: ${{ github.workspace }}/deepseek-harness
          DSH_SMOKE_HOME: ${{ runner.temp }}/dsh-opencode-public-home
          DSH_SMOKE_OUTPUT: ${{ github.workspace }}/desktop-opencode-evidence
          DSH_SMOKE_DRIVER: ${{ runner.temp }}/desktop-driver
        run: node scripts/desktop-opencode-proof.mjs
      - name: Retain requested real OpenCode screenshots and report
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[opencode-public-proof]')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-opencode-public-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: desktop-opencode-evidence/**
