name: Check upstream DSH compatibility

# Scheduling becomes active only after this workflow exists on the default
# branch and Actions is enabled. Committing to a private work branch does not
# activate a monitor. This workflow never updates manifests or publishes.
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact official npm version; blank discovers newest stable
        required: false
        type: string
      allow_prerelease:
        description: Explicitly opt this run into prerelease candidates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover exact published release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test discovery and fail-closed policy
        run: node --test test/upstream-compatibility.test.js
      - name: Read official npm metadata only
        id: discover
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
        run: |
          args=(discover --report "$RUNNER_TEMP/upstream-discovery/discovery.json")
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          if [ "$ALLOW_PRERELEASE" = true ]; then args+=(--allow-prerelease); fi
          node scripts/check-upstream-compatibility.mjs "${args[@]}"
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/upstream-discovery/discovery.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(report.matrix)}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Baseline: ${report.baseline.version}\n\nCandidate: ${report.candidate?.version ?? "none"}\n\nResult: ${report.status}. No automatic promotion.\n`);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-discovery/discovery.json
          if-no-files-found: error
          retention-days: 30

  qualify:
    name: ${{ matrix.role }} / ${{ matrix.version }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-input
      - name: Export code without checkout credentials or user configuration
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          # Refuse accidental credential-bearing configuration in the export.
          if git ls-files | grep -E '(^|/)(\.npmrc|\.credentials\.ya?ml|\.env(\..*)?|kernel\.local\.json)$'; then
            echo 'Refusing to export private local configuration.' >&2
            exit 1
          fi
          git archive --format=tar HEAD > "$RUNNER_TEMP/upstream-input/source.tar"
          mkdir -p "$RUNNER_TEMP/upstream-output"
          chmod 0777 "$RUNNER_TEMP/upstream-output"
      - name: Install pinned bytes and test inside a credential-free sandbox
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          # No runner HOME, .git, host socket, action tokens, repository secrets,
          # checkout credentials, or service credentials are mounted/passed.
          # Network is needed for public package installation. This is not an
          # offline/network-policy sandbox; candidate code must still be vetted.
          docker run --rm --init --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 512 --memory 6g --cpus 2 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,exec,nosuid,size=4g,uid=1000,gid=1000 \
            --mount "type=bind,src=$RUNNER_TEMP/upstream-input,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/upstream-output,dst=/output" \
            --env DSH_UPSTREAM_SANDBOX=1 --env "CHECK_ROLE=$ROLE" \
            node:24-bookworm-slim sh -ceu '
              mkdir -p /tmp/source
              tar -xf /input/source.tar -C /tmp/source
              cd /tmp/source
              node scripts/check-upstream-compatibility.mjs qualify \
                --discovery /input/discovery.json --role "$CHECK_ROLE" \
                --report /output/compatibility-report.json
            '
      - name: Preserve exact-version evidence and bounded qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-output/*.json
          if-no-files-found: warn
          retention-days: 30
