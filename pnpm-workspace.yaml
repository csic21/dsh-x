packages:
  - packages/*
# The suite depends on local plugin packages by exact published versions; link
# them inside the workspace instead of querying the registry for unpublished
# names. Packed tarballs keep plain version ranges, so the npm-based fixture
# install in scripts/test-suite-install.mjs is unaffected.
linkWorkspacePackages: true
# Dependencies allowed to run install scripts. These carry native or generated
# payloads that the npm baseline also built: the official subprocess package,
# esbuild, and the native bindings used by @anthropic-ai/claude-agent-sdk.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-tool@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2'
  - '@deepseek-ai/dsh-http-proxy@0.2.1-rc.2'
  - '@deepseek-ai/dsh-lazy-require@0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.2'
  - '@deepseek-ai/dsh-ptc-runtime@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.2.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session@0.2.1-rc.2'
  - '@deepseek-ai/dsh-subprocess-local@0.2.1-rc.2'
  - '@deepseek-ai/dsh-subprocess@0.2.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-tools@0.2.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.2'
  - '@deepseek-ai/dsh-user-approval@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.2'
  - '@deepseek-ai/dsh-win32-process@0.2.1-rc.2'
  - '@deepseek-ai/dsh-working-directory@0.2.1-rc.2'
